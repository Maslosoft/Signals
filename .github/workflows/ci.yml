name: PHP checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dependencies: locked
            extensions: curl, dom, mbstring, xml, xmlwriter
          - dependencies: lowest
            extensions: curl, dom, mbstring, xml, xmlwriter
          - dependencies: locked
            extensions: curl, dom, mbstring, xml, xmlwriter, swoole
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ${{ matrix.extensions }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --prefer-dist
      - if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - run: composer check
      - run: composer audit
